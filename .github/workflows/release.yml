name: Release

on:
  push:
    branches: [main]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # da može da napravi git tag
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine next version from conventional commits
        id: tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push versioned image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Baked into the SPA at build time. Set repo variables SIWE_DOMAIN /
          # SIWE_URI (Settings → Secrets and variables → Actions → Variables) to
          # the origin the UI is served from; dev defaults keep builds green.
          build-args: |
            VITE_SIWE_DOMAIN=${{ vars.SIWE_DOMAIN || 'localhost:3000' }}
            VITE_SIWE_URI=${{ vars.SIWE_URI || 'http://localhost:3000' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/shophub-frontend:${{ steps.tag.outputs.new_version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/shophub-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
